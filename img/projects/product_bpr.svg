<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="40" y="30" width="720" height="440" rx="14" fill="#161b27" stroke="#2a2d3a" stroke-width="1"/>
  <!-- Header -->
  <text x="400" y="68" font-family="sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">AI Product Spec Generator</text>
  <text x="400" y="88" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Powered by Claude API · Converts ideas → full PRDs in seconds</text>
  <!-- Input panel -->
  <rect x="60" y="104" width="310" height="200" rx="10" fill="#0d1117" stroke="#2a2d3a" stroke-width="1"/>
  <text x="76" y="124" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8">Feature Idea</text>
  <rect x="76" y="132" width="278" height="60" rx="6" fill="#161b27" stroke="#6366f1" stroke-width="1"/>
  <text x="88" y="150" font-family="monospace" font-size="10" fill="#94a3b8">A salary calculator that computes</text>
  <text x="88" y="164" font-family="monospace" font-size="10" fill="#94a3b8">federal and state take-home pay</text>
  <text x="88" y="178" font-family="monospace" font-size="10" fill="#94a3b8">with tax breakdown visualizations</text>
  <text x="76" y="212" font-family="sans-serif" font-size="10" fill="#94a3b8">Product Type</text>
  <rect x="76" y="218" width="130" height="24" rx="5" fill="#161b27" stroke="#2a2d3a"/>
  <text x="88" y="234" font-family="monospace" font-size="10" fill="#e2e8f0">Web Application</text>
  <text x="218" y="212" font-family="sans-serif" font-size="10" fill="#94a3b8">Target Users</text>
  <rect x="218" y="218" width="136" height="24" rx="5" fill="#161b27" stroke="#2a2d3a"/>
  <text x="230" y="234" font-family="monospace" font-size="10" fill="#e2e8f0">Professionals</text>
  <text x="76" y="262" font-family="sans-serif" font-size="10" fill="#94a3b8">AI Provider</text>
  <rect x="76" y="268" width="120" height="24" rx="5" fill="#161b27" stroke="#6366f1"/>
  <text x="88" y="284" font-family="monospace" font-size="10" fill="#818cf8">Claude (Anthropic)</text>
  <rect x="210" y="268" width="144" height="24" rx="12" fill="url(#accent)"/>
  <text x="282" y="284" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Generate PRD ✦</text>
  <!-- PRD output panel -->
  <rect x="390" y="104" width="370" height="200" rx="10" fill="#0d1117" stroke="#2a2d3a" stroke-width="1"/>
  <text x="406" y="124" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8">Generated PRD</text>
  <text x="406" y="144" font-family="monospace" font-size="10" font-weight="700" fill="#e2e8f0">## TL;DR</text>
  <text x="406" y="158" font-family="monospace" font-size="9" fill="#94a3b8">Take-home pay calculator with real-time</text>
  <text x="406" y="170" font-family="monospace" font-size="9" fill="#94a3b8">federal/state tax breakdown &amp; charts.</text>
  <text x="406" y="188" font-family="monospace" font-size="10" font-weight="700" fill="#e2e8f0">## Problem Statement</text>
  <text x="406" y="202" font-family="monospace" font-size="9" fill="#94a3b8">Professionals struggle to estimate</text>
  <text x="406" y="214" font-family="monospace" font-size="9" fill="#94a3b8">actual take-home across jurisdictions.</text>
  <text x="406" y="232" font-family="monospace" font-size="10" font-weight="700" fill="#e2e8f0">## User Stories</text>
  <text x="406" y="246" font-family="monospace" font-size="9" fill="#94a3b8">• As a user, I can input base salary...</text>
  <text x="406" y="260" font-family="monospace" font-size="9" fill="#94a3b8">• As a user, I can select filing status...</text>
  <text x="406" y="274" font-family="monospace" font-size="9" fill="#94a3b8">• As a user, I see a visual tax chart...</text>
  <text x="406" y="292" font-family="monospace" font-size="10" font-weight="700" fill="#6366f1">## Success Metrics  ✦ Acceptance Criteria...</text>
  <!-- Diagram panel -->
  <rect x="60" y="318" width="680" height="120" rx="10" fill="#0d1117" stroke="#2a2d3a" stroke-width="1"/>
  <text x="76" y="338" font-family="sans-serif" font-size="11" font-weight="700" fill="#818cf8">Architecture Diagram (Mermaid.js)</text>
  <!-- Flowchart nodes -->
  <rect x="80" y="348" width="80" height="28" rx="14" fill="#6366f1" opacity="0.9"/>
  <text x="120" y="366" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">User Input</text>
  <line x1="160" y1="362" x2="200" y2="362" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="200" y="348" width="100" height="28" rx="14" fill="#1e2435" stroke="#6366f1" stroke-width="1"/>
  <text x="250" y="366" font-family="monospace" font-size="9" fill="#818cf8" text-anchor="middle">Claude API</text>
  <line x1="300" y1="362" x2="340" y2="362" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="340" y="348" width="100" height="28" rx="14" fill="#1e2435" stroke="#6366f1" stroke-width="1"/>
  <text x="390" y="366" font-family="monospace" font-size="9" fill="#818cf8" text-anchor="middle">PRD Parser</text>
  <line x1="440" y1="362" x2="480" y2="362" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="480" y="348" width="100" height="28" rx="14" fill="#1e2435" stroke="#a78bfa" stroke-width="1"/>
  <text x="530" y="366" font-family="monospace" font-size="9" fill="#a78bfa" text-anchor="middle">Mermaid Diagram</text>
  <line x1="580" y1="362" x2="620" y2="362" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="620" y="348" width="100" height="28" rx="14" fill="#6366f1" opacity="0.9"/>
  <text x="670" y="366" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Export MD/SVG</text>
  <text x="400" y="418" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">9 structured sections · markdown export · SVG diagram export · dark/light theme</text>
  <!-- footer -->
  <text x="400" y="458" font-family="sans-serif" font-size="11" fill="#6366f1" text-anchor="middle">Product Spec Generator · Claude API · Mermaid.js · Vanilla JS</text>
</svg>
