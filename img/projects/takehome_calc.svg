<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a1d27"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#818cf8"/></linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#f59e0b"/><stop offset="100%" style="stop-color:#fbbf24"/></linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#10b981"/><stop offset="100%" style="stop-color:#34d399"/></linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#f43f5e"/><stop offset="100%" style="stop-color:#fb7185"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Card -->
  <rect x="40" y="30" width="720" height="440" rx="14" fill="#161b27" stroke="#2a2d3a" stroke-width="1"/>
  <!-- Header -->
  <text x="400" y="72" font-family="sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">Salary Take-Home Calculator</text>
  <text x="400" y="92" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2025 Federal &amp; State Tax Rates</text>
  <!-- Input row -->
  <rect x="70" y="108" width="220" height="38" rx="8" fill="#0d1117" stroke="#2a2d3a" stroke-width="1"/>
  <text x="84" y="122" font-family="monospace" font-size="9" fill="#94a3b8">Base Salary</text>
  <text x="84" y="138" font-family="monospace" font-size="13" font-weight="700" fill="#e2e8f0">$120,000</text>
  <rect x="305" y="108" width="160" height="38" rx="8" fill="#0d1117" stroke="#2a2d3a" stroke-width="1"/>
  <text x="319" y="122" font-family="monospace" font-size="9" fill="#94a3b8">Filing Status</text>
  <text x="319" y="138" font-family="monospace" font-size="12" fill="#e2e8f0">Single</text>
  <rect x="480" y="108" width="140" height="38" rx="8" fill="#0d1117" stroke="#2a2d3a" stroke-width="1"/>
  <text x="494" y="122" font-family="monospace" font-size="9" fill="#94a3b8">State</text>
  <text x="494" y="138" font-family="monospace" font-size="12" fill="#e2e8f0">Pennsylvania</text>
  <!-- Take-home result -->
  <rect x="70" y="162" width="310" height="90" rx="10" fill="#0d1117" stroke="#6366f1" stroke-width="1.5"/>
  <text x="90" y="186" font-family="sans-serif" font-size="11" fill="#94a3b8">Annual Take-Home</text>
  <text x="90" y="222" font-family="sans-serif" font-size="32" font-weight="800" fill="#818cf8">$84,720</text>
  <text x="90" y="242" font-family="sans-serif" font-size="11" fill="#94a3b8">70.6% of gross</text>
  <!-- Tax breakdown bars -->
  <text x="400" y="182" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tax Breakdown</text>
  <!-- Stacked bar -->
  <rect x="400" y="192" width="200" height="22" rx="4" fill="#6366f1"/>
  <rect x="600" y="192" width="80" height="22" rx="4" fill="#f59e0b"/>
  <rect x="680" y="192" width="34" height="22" rx="0" fill="#10b981"/>
  <rect x="714" y="192" width="16" height="22" rx="0" fill="#f43f5e"/>
  <text x="400" y="226" font-family="monospace" font-size="9" fill="#818cf8">■ Federal 22%</text>
  <text x="510" y="226" font-family="monospace" font-size="9" fill="#fbbf24">■ FICA 7.6%</text>
  <text x="600" y="226" font-family="monospace" font-size="9" fill="#34d399">■ State 3%</text>
  <text x="670" y="226" font-family="monospace" font-size="9" fill="#fb7185">■ Local</text>
  <!-- Itemized breakdown -->
  <rect x="70" y="268" width="660" height="170" rx="10" fill="#0d1117" stroke="#2a2d3a" stroke-width="1"/>
  <text x="90" y="290" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Itemized Deductions</text>
  <!-- rows -->
  <text x="90" y="314" font-family="monospace" font-size="11" fill="#94a3b8">Federal Income Tax</text><text x="680" y="314" font-family="monospace" font-size="11" fill="#f43f5e" text-anchor="end">-$19,480</text>
  <line x1="90" y1="320" x2="710" y2="320" stroke="#2a2d3a" stroke-width="0.5"/>
  <text x="90" y="338" font-family="monospace" font-size="11" fill="#94a3b8">Social Security</text><text x="680" y="338" font-family="monospace" font-size="11" fill="#f43f5e" text-anchor="end">-$7,440</text>
  <line x1="90" y1="344" x2="710" y2="344" stroke="#2a2d3a" stroke-width="0.5"/>
  <text x="90" y="362" font-family="monospace" font-size="11" fill="#94a3b8">Medicare</text><text x="680" y="362" font-family="monospace" font-size="11" fill="#f43f5e" text-anchor="end">-$1,740</text>
  <line x1="90" y1="368" x2="710" y2="368" stroke="#2a2d3a" stroke-width="0.5"/>
  <text x="90" y="386" font-family="monospace" font-size="11" fill="#94a3b8">State Tax (PA 3.07%)</text><text x="680" y="386" font-family="monospace" font-size="11" fill="#f43f5e" text-anchor="end">-$3,684</text>
  <line x1="90" y1="392" x2="710" y2="392" stroke="#2a2d3a" stroke-width="0.5"/>
  <text x="90" y="412" font-family="monospace" font-size="12" font-weight="700" fill="#818cf8">Take-Home Pay</text><text x="680" y="412" font-family="monospace" font-size="12" font-weight="700" fill="#818cf8" text-anchor="end">$84,720 / yr</text>
  <!-- footer -->
  <text x="400" y="458" font-family="sans-serif" font-size="11" fill="#6366f1" text-anchor="middle">Salary Calculator · HTML · CSS · Vanilla JS · 2025 Tax Rates</text>
</svg>
